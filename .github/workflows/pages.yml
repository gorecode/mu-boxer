name: Scene lab checks and Pages

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: scene-check-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: scene-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scene-lab/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Prepare browser
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            /usr/bin/google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: scene-lab/test-results
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: scene-lab/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
